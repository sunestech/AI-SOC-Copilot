services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: ai_soc_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    ports:
      - "9200:9200"
    volumes:
      - ai_soc_esdata:/usr/share/elasticsearch/data
    networks:
      - ai_soc_net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: ai_soc_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - ai_soc_net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    container_name: ai_soc_logstash
    environment:
      - LS_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "5044:5044"
      - "9600:9600"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ../data/elk_ingest:/usr/share/logstash/ingest:ro
    depends_on:
      - elasticsearch
    networks:
      - ai_soc_net

volumes:
  ai_soc_esdata:

networks:
  ai_soc_net:
    driver: bridge
