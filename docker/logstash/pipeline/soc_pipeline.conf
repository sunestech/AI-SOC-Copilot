input {
  file {
    id => "soc_alerts_jsonl"
    path => "/usr/share/logstash/ingest/soc_alerts/*.jsonl"
    start_position => "beginning"
    mode => "read"
    sincedb_path => "/dev/null"
    codec => "json"
    add_field => { "index_route" => "soc_dataset_alert" }
  }

  file {
    id => "suricata_sim_json"
    path => "/usr/share/logstash/ingest/suricata/*.json"
    start_position => "beginning"
    mode => "read"
    sincedb_path => "/dev/null"
    codec => "json"
    add_field => { "index_route" => "suricata_simulated" }
  }

  file {
    id => "zeek_sim_json"
    path => "/usr/share/logstash/ingest/zeek/*.json"
    start_position => "beginning"
    mode => "read"
    sincedb_path => "/dev/null"
    codec => "json"
    add_field => { "index_route" => "zeek_simulated" }
  }

  file {
    id => "nids_predictions_jsonl"
    path => "/usr/share/logstash/ingest/nids/*.jsonl"
    start_position => "beginning"
    mode => "read"
    sincedb_path => "/dev/null"
    codec => "json"
    add_field => { "index_route" => "nids_model" }
  }

  file {
    id => "suricata_real_json"
    path => "/usr/share/logstash/ingest/suricata_real/*.json"
    start_position => "beginning"
    mode => "read"
    sincedb_path => "/dev/null"
    codec => "json"
    add_field => {
      "index_route" => "suricata_real"
      "sensor_mode" => "live_vmware_lab"
    }
  }

  file {
    id => "zeek_real_json"
    path => "/usr/share/logstash/ingest/zeek_real/*.json"
    start_position => "beginning"
    mode => "read"
    sincedb_path => "/dev/null"
    codec => "json"
    add_field => {
      "index_route" => "zeek_real"
      "sensor_mode" => "live_vmware_lab"
    }
  }
}

filter {
  mutate {
    add_field => { "project" => "AI SOC Copilot" }
  }

  if [event_source] == "zeek_real" {
    mutate {
      replace => { "index_route" => "zeek_real" }
    }
  }

  if [event_source] == "suricata_real" {
    mutate {
      replace => { "index_route" => "suricata_real" }
    }
  }
}

output {
  if [index_route] == "suricata_real" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "soc-alerts-suricata-real-%{+YYYY.MM.dd}"
    }
  } else if [index_route] == "zeek_real" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "soc-alerts-zeek-real-%{+YYYY.MM.dd}"
    }
  } else if [index_route] == "suricata_simulated" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "soc-alerts-suricata-%{+YYYY.MM.dd}"
    }
  } else if [index_route] == "zeek_simulated" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "soc-alerts-zeek-%{+YYYY.MM.dd}"
    }
  } else if [index_route] == "nids_model" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "nids-predictions-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "soc-alerts-dataset-%{+YYYY.MM.dd}"
    }
  }

  stdout {
    codec => dots
  }
}